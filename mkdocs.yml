site_name: finlab
site_url: https://landtml.github.io/finlab-ml/
site_description: Python implementations of the methods in López de Prado's Advances in Financial Machine Learning, with tests and proof notes.
repo_url: https://github.com/landtml/finlab-ml
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search

# A broken link or anchor is a warning, and `mkdocs build --strict` turns warnings into errors.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Modules:
      - finlab.cv (ch. 7): modules/cv.md
      - finlab.bars (ch. 2): modules/bars.md
      - finlab.labeling (ch. 3): modules/labeling.md
      - finlab.weights (ch. 4): modules/weights.md
      - finlab.monte_carlo (ch. 4): modules/monte_carlo.md
      - finlab.fracdiff (ch. 5): modules/fracdiff.md
      - finlab.ensemble (ch. 6): modules/ensemble.md
      - finlab.importance (ch. 8): modules/importance.md
      - finlab.tuning (ch. 9): modules/tuning.md
      - finlab.bet_sizing (ch. 10): modules/bet_sizing.md
      - finlab.pbo (ch. 11): modules/pbo.md
      - finlab.trading_rules (ch. 13): modules/trading_rules.md
      - finlab.trials (not AFML): modules/trials.md
      - finlab.onc (not AFML): modules/onc.md
      - finlab.agent (not AFML): modules/agent.md
      - finlab.stats (ch. 14): modules/stats.md
      - finlab.strategy_risk (ch. 15): modules/strategy_risk.md
      - finlab.plot (optional): modules/plot.md
      - finlab.hrp (ch. 16): modules/hrp.md
      - finlab.structural_breaks (ch. 17): modules/structural_breaks.md
      - finlab.entropy (ch. 18): modules/entropy.md
      - finlab.microstructure (ch. 19): modules/microstructure.md
      - finlab.parallel (ch. 20): modules/parallel.md
  - Proof notes:
      - finlab.cv (CPCV): proofs/cpcv.md
      - finlab.bars: proofs/bars.md
      - finlab.labeling: proofs/labeling.md
      - finlab.weights: proofs/weights.md
      - finlab.monte_carlo: proofs/monte_carlo.md
      - finlab.fracdiff: proofs/fracdiff.md
      - finlab.ensemble: proofs/ensemble.md
      - finlab.importance: proofs/importance.md
      - finlab.tuning: proofs/tuning.md
      - finlab.bet_sizing: proofs/bet_sizing.md
      - finlab.pbo: proofs/pbo.md
      - finlab.trading_rules: proofs/trading_rules.md
      - finlab.onc: proofs/onc.md
      - finlab.agent: proofs/agent.md
      - finlab.stats: proofs/stats.md
      - finlab.strategy_risk: proofs/strategy_risk.md
      - finlab.hrp: proofs/hrp.md
      - finlab.structural_breaks: proofs/structural_breaks.md
      - finlab.entropy: proofs/entropy.md
      - finlab.microstructure: proofs/microstructure.md
      - finlab.parallel: proofs/parallel.md
  - API reference: API.md
  - MCP server: AGENTS.md
  - Changelog: https://github.com/landtml/finlab-ml/blob/main/CHANGELOG.md
