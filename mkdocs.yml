site_name: quantowl
site_url: https://landtml.github.io/quantowl/
site_description: Python implementations of the methods in López de Prado's Advances in Financial Machine Learning, with tests and proof notes.
repo_url: https://github.com/landtml/quantowl
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search

# A broken link or anchor is a warning, and `mkdocs build --strict` turns warnings into errors.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Modules:
      - quantowl.cv (ch. 7): modules/cv.md
      - quantowl.bars (ch. 2): modules/bars.md
      - quantowl.labeling (ch. 3): modules/labeling.md
      - quantowl.weights (ch. 4): modules/weights.md
      - quantowl.monte_carlo (ch. 4): modules/monte_carlo.md
      - quantowl.fracdiff (ch. 5): modules/fracdiff.md
      - quantowl.ensemble (ch. 6): modules/ensemble.md
      - quantowl.importance (ch. 8): modules/importance.md
      - quantowl.tuning (ch. 9): modules/tuning.md
      - quantowl.bet_sizing (ch. 10): modules/bet_sizing.md
      - quantowl.pbo (ch. 11): modules/pbo.md
      - quantowl.trading_rules (ch. 13): modules/trading_rules.md
      - quantowl.trials (not AFML): modules/trials.md
      - quantowl.onc (not AFML): modules/onc.md
      - quantowl.agent (not AFML): modules/agent.md
      - quantowl.stats (ch. 14): modules/stats.md
      - quantowl.strategy_risk (ch. 15): modules/strategy_risk.md
      - quantowl.plot (optional): modules/plot.md
      - quantowl.hrp (ch. 16): modules/hrp.md
      - quantowl.structural_breaks (ch. 17): modules/structural_breaks.md
      - quantowl.entropy (ch. 18): modules/entropy.md
      - quantowl.microstructure (ch. 19): modules/microstructure.md
      - quantowl.parallel (ch. 20): modules/parallel.md
  - Proof notes:
      - quantowl.cv (CPCV): proofs/cpcv.md
      - quantowl.bars: proofs/bars.md
      - quantowl.labeling: proofs/labeling.md
      - quantowl.weights: proofs/weights.md
      - quantowl.monte_carlo: proofs/monte_carlo.md
      - quantowl.fracdiff: proofs/fracdiff.md
      - quantowl.ensemble: proofs/ensemble.md
      - quantowl.importance: proofs/importance.md
      - quantowl.tuning: proofs/tuning.md
      - quantowl.bet_sizing: proofs/bet_sizing.md
      - quantowl.pbo: proofs/pbo.md
      - quantowl.trading_rules: proofs/trading_rules.md
      - quantowl.onc: proofs/onc.md
      - quantowl.agent: proofs/agent.md
      - quantowl.stats: proofs/stats.md
      - quantowl.strategy_risk: proofs/strategy_risk.md
      - quantowl.hrp: proofs/hrp.md
      - quantowl.structural_breaks: proofs/structural_breaks.md
      - quantowl.entropy: proofs/entropy.md
      - quantowl.microstructure: proofs/microstructure.md
      - quantowl.parallel: proofs/parallel.md
  - API reference: API.md
  - MCP server: AGENTS.md
  - Changelog: https://github.com/landtml/quantowl/blob/main/CHANGELOG.md
