name: Branch cleanup

# Deletes feature branches that no open pull request uses. Protected branches
# are main and release-*; the rules live in tools/prune_branches.py.

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the branches that would be deleted, delete none"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Delete the head branch of a closed pull request
        if: github.event_name == 'pull_request'
        run: python tools/prune_branches.py event

      - name: Prune branches whose pull requests are all closed
        if: github.event_name != 'pull_request'
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          flag=""
          if [[ "$DRY_RUN" == "true" ]]; then flag="--dry-run"; fi
          python tools/prune_branches.py prune $flag
