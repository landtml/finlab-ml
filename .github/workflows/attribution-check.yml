name: Attribution check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          # A push that creates a branch sends an all-zeros "before" SHA, and a
          # force-push leaves the old "before" SHA unreachable from HEAD.
          if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base origin/main HEAD)"
          fi
          python tools/check_attribution.py --commits "$base..HEAD"

      - name: Check pull request body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python tools/check_attribution.py --body-file "$RUNNER_TEMP/pr-body.md"
