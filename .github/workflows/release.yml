name: Release

# Publishes a release when a commit on main carries a version that has no tag
# yet. If the tag exists but its release has no sdist or wheel, rebuilds them
# from the tag and uploads them to that release. Runs only after CI passes on
# that commit. See RELEASING.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the version and check for its tag
        id: version
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=false" >> "$GITHUB_OUTPUT"
          echo "repair=false" >> "$GITHUB_OUTPUT"
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif ! gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already tagged and has no release; nothing to release."
          else
            assets="$(gh release view "v$version" --json assets --jq '.assets[].name')"
            if grep -q '\.tar\.gz$' <<< "$assets" && grep -q '\.whl$' <<< "$assets"; then
              echo "v$version is already tagged; nothing to release."
            else
              echo "v$version is tagged but its release lacks the sdist or wheel; rebuilding from the tag."
              echo "repair=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Write the release notes
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python .github/scripts/release_notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          if ! grep -q "@v$VERSION" README.md; then
            echo "::warning::README.md does not mention @v$VERSION in its install command"
          fi

      - name: Check out the tag for a repair
        if: steps.version.outputs.repair == 'true'
        uses: actions/checkout@v4
        with:
          ref: v${{ steps.version.outputs.version }}

      - name: Build sdist and wheel
        if: steps.version.outputs.release == 'true' || steps.version.outputs.repair == 'true'
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Tag and publish the release
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$SHA" \
            --title "quantowl $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Upload the sdist and wheel to the existing release
        if: steps.version.outputs.repair == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "v$VERSION" dist/* --clobber
