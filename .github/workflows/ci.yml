name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with the plot and notebook extras
        run: pip install -e ".[dev,plot,notebooks]"

      - name: Lint
        run: ruff check src tests tools benchmarks examples

      - name: Type check
        # One version is enough: the numpy and pandas stubs differ across the matrix.
        if: matrix.python-version == '3.13'
        run: mypy

      - name: Run test suite
        run: pytest -q

  install:
    # Tests the built wheel, not the checkout, so a package that only works
    # from the source tree fails here. Runs once without the optional extras
    # and once with them, so both install paths are covered.
    runs-on: ubuntu-latest
    name: install ${{ matrix.extras || 'core' }}
    strategy:
      fail-fast: false
      matrix:
        extras: ["", "[plot,notebooks]"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel into a temp directory
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/dist"

      - name: Install the wheel into a fresh venv outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          whl="$(ls "$RUNNER_TEMP"/dist/*.whl)"
          "$RUNNER_TEMP/venv/bin/python" -m pip install "${whl}${{ matrix.extras }}" "pytest>=7.4"

      - name: Confirm finlab imports from the installed venv
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "import finlab, os, sys; print(finlab.__file__); assert finlab.__file__.startswith(sys.prefix), finlab.__file__; assert not finlab.__file__.startswith(os.environ['GITHUB_WORKSPACE']), finlab.__file__"

      - name: Run test suite against the installed package
        run: |
          # tests/test_doc_examples.py reads docs/modules, and the example tests
          # read examples/, relative to the repository root, so both are copied
          # next to tests/. pyproject.toml is copied so the pytest markers resolve
          # as they do in the checkout.
          suite="$RUNNER_TEMP/suite"
          rm -rf "$suite" && mkdir "$suite"
          cp -r tests docs examples tools pyproject.toml "$suite/"
          cd "$suite"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q

  minimum-versions:
    # Runs the suite against the lowest dependency versions pyproject.toml allows, so a
    # newer API cannot slip in while the declared floor stays the same.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install the minimum supported versions
        run: |
          pip install "numpy==1.24.*" "pandas==2.0.*" "numba==0.59.*" "scipy==1.10.*" "pytest>=7.4"
          pip install --no-deps -e .

      - name: Run test suite
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Verify the wheel carries the type marker
        run: python -m zipfile -l dist/*.whl | grep -q "py.typed"
