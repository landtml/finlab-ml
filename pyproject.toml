[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finlab"
version = "0.1.0"
description = "High-performance toolkit for financial machine learning, implementing Advances in Financial Machine Learning (Lopez de Prado)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "landtml" }]
requires-python = ">=3.10"
keywords = [
    "financial machine learning",
    "quantitative finance",
    "algorithmic trading",
    "backtesting",
    "purged cross-validation",
    "combinatorial purged cross-validation",
    "triple barrier",
    "meta-labeling",
    "fractional differentiation",
    "bet sizing",
    "deflated sharpe ratio",
    "probability of backtest overfitting",
    "hierarchical risk parity",
    "Advances in Financial Machine Learning",
    "Lopez de Prado",
    "numba",
    "MCP",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "numba>=0.59",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
bench = ["pytest-benchmark>=4.0"]

[project.scripts]
finlab-mcp = "finlab.agent.server:main"

[project.urls]
Homepage = "https://github.com/landtml/finlab-ml"
Repository = "https://github.com/landtml/finlab-ml"
Documentation = "https://github.com/landtml/finlab-ml/tree/main/docs"
Issues = "https://github.com/landtml/finlab-ml/issues"
Changelog = "https://github.com/landtml/finlab-ml/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finlab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running brute-force cross-checks",
    "integration: requires network access (live data); skipped when unavailable",
]
