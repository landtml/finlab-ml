[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finlab"
version = "0.1.0"
description = "High-performance toolkit for financial machine learning, implementing Advances in Financial Machine Learning (Lopez de Prado)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "landtml" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "numba>=0.59",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
bench = ["pytest-benchmark>=4.0"]

[project.scripts]
finlab-mcp = "finlab.agent.server:main"

[project.urls]
Repository = "https://github.com/landtml/finlab-ml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finlab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running brute-force cross-checks",
    "integration: requires network access (live data); skipped when unavailable",
]
